name: Kalite ve uretim dagitimi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-konsept-gelsin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Yerel kalite kapilari
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kullan
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""
      - name: Tum kalite kapilarini calistir
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run validate

  deploy:
    name: Uretime dagit
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://konseptgelsin.com
    env:
      DEPLOY_BASE: /home/locko-admin/apps/konsept-gelsin
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: SSH baglantisini hazirla
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_HOST" in ""|*[!A-Za-z0-9.:-]*) echo "DEPLOY_HOST gecersiz." >&2; exit 1;; esac
          case "$DEPLOY_USER" in ""|*[!A-Za-z0-9._-]*) echo "DEPLOY_USER gecersiz." >&2; exit 1;; esac
          case "$DEPLOY_PORT" in ""|*[!0-9]*) echo "DEPLOY_PORT gecersiz." >&2; exit 1;; esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

      - name: Surum paketini sunucuya aktar
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE="$RUNNER_TEMP/${RELEASE_ID}.tgz"
          tar \
            --exclude=.git \
            --exclude=.codex \
            --exclude=.impeccable \
            --exclude=node_modules \
            --exclude=test-results \
            -czf "$ARCHIVE" .
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSH_ARGS=(-i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP_ARGS=(-i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_ARGS[@]}" "$TARGET" "install -d -m 750 '$DEPLOY_BASE/incoming' '$DEPLOY_BASE/releases'"
          scp "${SCP_ARGS[@]}" "$ARCHIVE" "$TARGET:$DEPLOY_BASE/incoming/$RELEASE_ID.tgz"

      - name: Docker surumunu etkinlestir ve dogrula
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSH_ARGS=(-i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_ARGS[@]}" "$TARGET" \
            "BUILD_REVISION='$GITHUB_SHA' RELEASE_ID='$RELEASE_ID' DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          archive="$DEPLOY_BASE/incoming/$RELEASE_ID.tgz"
          release="$DEPLOY_BASE/releases/$RELEASE_ID"
          previous=""
          if [ -L "$DEPLOY_BASE/current" ]; then
            previous="$(readlink -f "$DEPLOY_BASE/current" || true)"
          fi

          install -d -m 750 "$release"
          tar -xzf "$archive" -C "$release"
          printf '%s\n' "$BUILD_REVISION" > "$release/.deployment-revision"
          cd "$release"

          compose() {
            BUILD_REVISION="$BUILD_REVISION" docker compose -f deploy/compose.production.yaml -p konsept-gelsin "$@"
          }

          compose config -q
          compose build --pull frontend
          compose up -d --no-deps --remove-orphans frontend

          container_id="$(compose ps -q frontend)"
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done

          if [ "$status" != "healthy" ]; then
            compose logs --tail 80 frontend || true
            if [ -n "$previous" ] && [ "${previous#"$DEPLOY_BASE/releases/"}" != "$previous" ] && [ -f "$previous/.deployment-revision" ]; then
              previous_revision="$(cat "$previous/.deployment-revision")"
              cd "$previous"
              BUILD_REVISION="$previous_revision" docker compose -f deploy/compose.production.yaml -p konsept-gelsin up -d --no-deps frontend
            fi
            echo "Yeni container saglikli olmadi: $status" >&2
            exit 1
          fi

          ln -sfn "$release" "$DEPLOY_BASE/current"
          rm -f "$archive"
          echo "Dagitilan commit: $BUILD_REVISION"
          REMOTE
