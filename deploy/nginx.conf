server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    client_max_body_size 10k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        expires -1;
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
        if ($request_uri ~ "^/index\.html(?:\?|$)") {
            return 301 https://konseptgelsin.com/;
        }
        try_files $uri =404;
    }

    location = /index {
        return 301 https://konseptgelsin.com/;
    }

    location ~* \.(?:css|js|json|webp|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1h;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        expires -1;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
